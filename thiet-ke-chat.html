<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử giao diện chat tự động – bản xem trước</title>
<style>
  :root { --xanh: #2e86c1; --xanh-dam: #2b5f80; --nen: #faf8f5; --chu: #2b2d36; --nhat: #eef5fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #dfe8f0; color: var(--chu); min-height: 100vh; }
  .gia-trang { padding: 24px; font-size: 14px; color: #55606b; text-align: center; }
  .gia-trang b { color: var(--xanh-dam); }

  /* Nút mở chat */
  .mo { position: fixed; right: 18px; bottom: 18px; width: 62px; height: 62px; border-radius: 50%; border: 0; background: var(--xanh); color: #fff; font-size: 28px; box-shadow: 0 4px 14px rgba(46,134,193,.4); cursor: pointer; z-index: 20; }
  .mo .cham { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background: #5cc98a; border: 2px solid #fff; }

  /* Khung chat */
  .khung { position: fixed; right: 18px; bottom: 92px; width: min(380px, calc(100vw - 36px)); height: min(560px, calc(100vh - 120px)); background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.2); display: none; flex-direction: column; overflow: hidden; z-index: 21; }
  .khung.mo-khung { display: flex; }
  .dau { background: var(--xanh); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .dau img { width: 40px; height: 40px; border-radius: 10px; background: #fff; }
  .dau .ten { font-weight: 800; font-size: 16px; }
  .dau .phu { font-size: 12.5px; opacity: .9; }
  .dau .dong { margin-left: auto; background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }

  .noi-dung { flex: 1; overflow-y: auto; padding: 14px; background: var(--nen); display: flex; flex-direction: column; gap: 10px; }
  .bong { max-width: 84%; padding: 10px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; }
  .bong.bot { background: #fff; border: 1px solid #e3ebf2; align-self: flex-start; border-bottom-left-radius: 4px; }
  .bong.nguoi { background: var(--xanh); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bong a { color: var(--xanh-dam); font-weight: 700; }
  .nhanh { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .nhanh button { border: 1px solid #bcd7ea; background: var(--nhat); color: var(--xanh-dam); border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .canh { font-size: 12.5px; color: #7a4a00; background: #fff6e0; border: 1px solid #f0d9a0; border-radius: 10px; padding: 8px 10px; }
  .dang-go { font-size: 13px; color: #6e7180; padding-left: 4px; min-height: 18px; }

  .nhap { border-top: 1px solid #e3ebf2; display: flex; gap: 8px; padding: 10px; background: #fff; }
  .nhap input { flex: 1; border: 1px solid #cfdde8; border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 15px; outline: none; }
  .nhap input:focus { border-color: var(--xanh); }
  .nhap button { border: 0; background: var(--xanh); color: #fff; border-radius: 999px; padding: 0 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .goi { text-align: center; font-size: 12.5px; padding: 0 10px 10px; background: #fff; color: #6e7180; }
  .goi a { color: var(--xanh-dam); font-weight: 700; }
  body.nhung { background: transparent; min-height: 0; }
  body.nhung .gia-trang { display: none; }
</style>
</head>
<body>
<script>if (location.search.includes('nhung')) document.body.classList.add('nhung');</script>
<div class="gia-trang">Bản xem trước giao diện chat, <b>chưa triển khai</b>. Câu trả lời là kịch bản mẫu, bấm các gợi ý để thử.</div>

<button class="mo" id="nut-mo" aria-label="Mở trò chuyện">💬<span class="cham"></span></button>

<section class="khung" id="khung" aria-label="Trò chuyện với Công an xã">
  <div class="dau">
    <img src="anh/huy-hieu.jpg" alt="">
    <div>
      <div class="ten">Trợ lý Công an xã Bờ Ngoong</div>
      <div class="phu">Trả lời tự động · cán bộ trực 0269 350 2339</div>
    </div>
    <button class="dong" id="nut-dong" aria-label="Đóng">✕</button>
  </div>
  <div class="noi-dung" id="noi"></div>
  <div class="dang-go" id="dang-go"></div>
  <div class="nhap">
    <input id="o" type="text" placeholder="Nhập câu hỏi của bạn…" autocomplete="off">
    <button id="gui" type="button">Gửi</button>
  </div>
  <div class="goi">Không gửi mật khẩu, mã OTP, passcode hay số CCCD vào đây.</div>
</section>

<script src="chat-bo-nao.js?v=6"></script>
</body>
</html>
